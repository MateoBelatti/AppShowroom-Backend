name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore appShowroom.slnx

      - name: Build
        run: dotnet build appShowroom.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test appShowroom.slnx --no-build --configuration Release --verbosity normal
